<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coin Book</title>
<meta name="description" content="A digital coin album of microscope scans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="masthead">
  <div class="wrap masthead-row">
    <a class="brand" href="#">Coin Book</a>
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  </div>
</header>
<main class="wrap" id="view" tabindex="-1">
  <p class="loading">Opening the album…</p>
</main>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
  <div class="viewer-top">
    <div class="viewer-heading">
      <p class="eyebrow" id="viewer-series"></p>
      <h2 id="viewer-title"></h2>
    </div>
    <div class="side-tabs" id="side-tabs" role="tablist" aria-label="Side of the coin"></div>
    <button class="icon-btn close" id="viewer-close" type="button" aria-label="Close (Esc)">✕</button>
  </div>
  <div class="viewer-stage">
    <div id="osd" class="osd"></div>
    <button class="icon-btn nav prev" id="viewer-prev" type="button" aria-label="Previous coin">‹</button>
    <button class="icon-btn nav next" id="viewer-next" type="button" aria-label="Next coin">›</button>
    <div class="zoom-tools" role="group" aria-label="Zoom">
      <button class="icon-btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <button class="icon-btn" id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button class="icon-btn" id="zoom-fit" type="button" aria-label="Fit whole coin">⤢</button>
      <button class="icon-btn" id="zoom-full" type="button" aria-label="Full screen">⛶</button>
    </div>
  </div>
  <dl class="viewer-info" id="viewer-info"></dl>
</div>

<script src="lib/openseadragon.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
